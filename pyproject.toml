[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-better"
dynamic = ["version"]
description = "Verify citations, cut text that does not serve the novelty claim, and raise reviewer questions. Does not write your paper for you."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Suprith R B" }]
keywords = ["research", "academic-writing", "citations", "peer-review", "latex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

# Base install stays deliberately small. Someone installing this to check
# citations should not be made to install a PDF stack to do it. Format
# parsers live behind extras and are imported lazily.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
latex = ["bibtexparser>=1.4,<2"]
docx = ["python-docx>=1.1"]
pdf = ["pypdf>=4.0"]
all = ["bibtexparser>=1.4,<2", "python-docx>=1.1", "pypdf>=4.0"]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "twine>=5.0",
]

[project.scripts]
research-better = "research_better.cli:main"
rb = "research_better.cli:main"

[project.urls]
Homepage = "https://github.com/suppprith/research-better"
Issues = "https://github.com/suppprith/research-better/issues"

[tool.hatch.version]
path = "src/research_better/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/research_better"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Segmentation has to name curly quotes and guillemets literally, because real
# papers contain them and a sentence can end on one. RUF001 reads those as
# lookalikes for ASCII quotes, which here is the point rather than a mistake.
"src/research_better/segmentation.py" = ["RUF001"]
# Citation ranges in a real paper are written with an en dash as often as with
# a hyphen, so the pattern has to accept both. RUF001 reads the en dash as a
# typo for a hyphen, which is exactly the case being matched.
"src/research_better/ingest/citations.py" = ["RUF001"]
# SIM905 would turn the readable stopword block into one 700-character list
# literal. The split form is the maintainable one here.
"src/research_better/fluff/structural.py" = ["SIM905"]
# Same reason for the stopword and participle blocks. RUF001 fires on the curly
# apostrophe in the word pattern, which real papers contain and which the
# tokenizer therefore has to accept.
"src/research_better/voice.py" = ["SIM905", "RUF001"]
"src/research_better/sources/merge.py" = ["SIM905"]
"src/research_better/grounding/claims.py" = ["SIM905"]
"src/research_better/novelty.py" = ["SIM905"]
# RUF001 fires on the curly quote marks the attribution audit has to recognise,
# because real drafts contain them and that is the point of the check.
"src/research_better/grounding/originality.py" = ["SIM905", "RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Strict for the core model, and for the public API. Every later pass addresses
# text through the model, so a type error there propagates into every artifact
# the tool emits. The API is what other people's code is typed against, and a
# published surface is the one place a loose annotation cannot be corrected
# quietly later.
[[tool.mypy.overrides]]
module = [
    "research_better",
    "research_better.api",
    "research_better.builder",
    "research_better.model",
    "research_better.segmentation",
    "research_better.spans",
]
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true

# Lenient for parser adapters. They deal with untyped third-party parsers and
# messy real-world input, and forcing strictness there buys noise, not safety.
[[tool.mypy.overrides]]
module = ["research_better.ingest.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["bibtexparser.*", "docx.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits a live external API. Excluded from the default run.",
    "latex: needs a LaTeX toolchain on PATH. Excluded from the default run.",
]
addopts = "-m 'not network and not latex'"

[tool.coverage.run]
source = ["src/research_better"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
