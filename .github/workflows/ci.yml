name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[all,dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      # The tool flags fluff in other people's writing, so its own output has to
      # hold the same line. See CONTRIBUTING.md for the full rules.
      - name: prose rules
        run: python scripts/lint_prose.py

      - name: mypy
        run: mypy

  test:
    name: pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[all,dev]"

      # Network tests are excluded by the addopts marker filter in
      # pyproject.toml. This run touches no external API, so the build does not
      # go red because somebody else's server is slow. The live suite runs on a
      # schedule in network.yml.
      - name: pytest
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70

  latex:
    name: latex still compiles after writeback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The claim is that a paper still builds after the ledger has been
      # applied to it. Asserting that without a compiler would be assuming
      # exactly the thing worth checking, so this job installs one.
      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base

      - name: Install
        run: pip install -e ".[all,dev]"

      - name: pytest
        run: pytest -m latex --no-cov
